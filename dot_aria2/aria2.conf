# aria2c config file

# Connection settings tuned for 1Gbps
max-concurrent-downloads=4
max-connection-per-server=16
min-split-size=20M
split=32

# Buffer settings for high-speed transfers
disk-cache=128M
file-allocation=falloc
enable-mmap=true

# Prevent timeouts on fast connections
timeout=600
connect-timeout=30
max-tries=5
retry-wait=10

# Optional but helpful for large files
continue=true
check-integrity=true
